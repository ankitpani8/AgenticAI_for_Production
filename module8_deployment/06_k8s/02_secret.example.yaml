# SECRET TEMPLATE — do NOT commit a real filled-in version of this.
#
# This file ends in .example.yaml on purpose. Copy it, fill in real values,
# apply the copy, and keep the copy OUT of git (.gitignore covers secret*.yaml).
#
# Two ways to create this Secret; prefer the CLI so plaintext never touches a
# file at all:
#
#   kubectl create secret generic agentic-secrets -n agentic \
#     --from-literal=GEMINI_API_KEY=your-key \
#     --from-literal=ANTHROPIC_API_KEY=your-key
#
# `stringData` (below) lets you write plaintext and let K8s base64-encode it.
# NOTE: a K8s Secret is base64-encoded, NOT encrypted at rest by default —
# enable encryption-at-rest or an external secrets manager for real prod.
apiVersion: v1
kind: Secret
metadata:
  name: agentic-secrets
  namespace: agentic
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
